<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#01060c" />
<meta name="color-scheme" content="dark" />
<title>J.A.R.V.I.S. · storage</title>
<link rel="icon" href="https://i.ibb.co.com/jkznH759/81b81b38c72e148ce4ddfcae172733f0.jpg" />
<style>
  :root {
    --cy: #42e8ff;
    --cy-dim: rgba(66, 232, 255, .35);
    --cy-faint: rgba(66, 232, 255, .12);
    --amber: #ffb74a;
    --ok: #5affa8;
    --err: #ff7a6b;
    --bg: #01060c;
    --panel: rgba(1, 12, 22, .82);
    --font-serif: "Times New Roman", Times, Baskerville, Georgia, serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-serif);
    color: var(--cy);
    letter-spacing: .06em;
    background: var(--bg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: fixed;
    inset: 0;
  }

  /* ---------- background ---------- */
  #bg-fallback {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 50%, rgba(20, 90, 130, .55), transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 120%, rgba(10, 60, 95, .5), transparent 65%),
      conic-gradient(from 0deg at 50% 50%, rgba(66, 232, 255, .05), transparent 25%, rgba(66, 232, 255, .05) 50%, transparent 75%, rgba(66, 232, 255, .05));
    animation: slowspin 90s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes slowspin { to { transform: rotate(360deg) scale(1.15); } }

  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--cy-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--cy-faint) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: .2;
    mask-image: radial-gradient(ellipse 65% 60% at 50% 45%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 65% 60% at 50% 45%, #000 20%, transparent 78%);
    pointer-events: none;
    z-index: 1;
  }

  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 35%, rgba(1, 6, 12, .75) 80%, #01060c 100%);
    pointer-events: none;
    z-index: 1;
  }

  #scanlines {
    position: absolute; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
    opacity: .42;
    z-index: 40;
  }

  #flicker {
    position: absolute; inset: 0;
    pointer-events: none;
    background: rgba(66, 232, 255, .025);
    animation: flick 6s steps(1) infinite;
    z-index: 39;
  }
  @keyframes flick {
    0%, 97% { opacity: 0; }
    97.5% { opacity: 1; }
    98% { opacity: 0; }
    98.6% { opacity: .7; }
    99% { opacity: 0; }
  }

  /* ============================================================
     LOGIN
     ============================================================ */
  #login {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      calc(env(safe-area-inset-right, 0px) + 20px)
      calc(env(safe-area-inset-bottom, 0px) + 20px)
      calc(env(safe-area-inset-left, 0px) + 20px);
    background: var(--bg);
    transition: opacity .5s ease, visibility .5s ease;
  }
  #login.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .login-card {
    position: relative;
    width: min(92vw, 400px);
    padding: 32px 26px 26px;
    background: var(--panel);
    border: 1px solid rgba(66, 232, 255, .28);
    box-shadow: 0 0 40px rgba(66, 232, 255, .15), inset 0 0 24px rgba(66, 232, 255, .04);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .login-logo {
    display: block;
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 0 2px rgba(66,232,255,.55),
      0 0 24px rgba(66,232,255,.55),
      0 0 60px rgba(66,232,255,.28);
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .login-kicker {
    text-align: center;
    font-size: 9px;
    letter-spacing: .38em;
    text-indent: .38em;
    color: rgba(66, 232, 255, .55);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .login-title {
    text-align: center;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 400;
    letter-spacing: .18em;
    text-indent: .18em;
    color: #dff9ff;
    text-shadow: 0 0 18px rgba(66, 232, 255, .6);
    margin-bottom: 26px;
  }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 9px;
    letter-spacing: .32em;
    text-indent: .32em;
    text-transform: uppercase;
    color: rgba(66, 232, 255, .55);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 11px 14px;
    font-family: var(--font-serif);
    font-size: 13px;
    letter-spacing: .06em;
    color: #eafdff;
    background: rgba(66, 232, 255, .05);
    border: 1px solid rgba(66, 232, 255, .28);
    border-radius: 4px;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    -webkit-user-select: text;
    user-select: text;
  }
  .field input::placeholder {
    color: rgba(66, 232, 255, .3);
    letter-spacing: .1em;
  }
  .field input:focus {
    border-color: rgba(66, 232, 255, .8);
    box-shadow: 0 0 16px rgba(66, 232, 255, .2);
    background: rgba(66, 232, 255, .09);
  }

  .login-btn {
    width: 100%;
    margin-top: 8px;
    padding: 13px 16px;
    font-family: var(--font-serif);
    font-size: 11px;
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    color: #01121a;
    background: linear-gradient(145deg, #6ff0ff, #2ec7e6);
    border: 1px solid rgba(160, 250, 255, .8);
    box-shadow: 0 0 24px rgba(66, 232, 255, .4), inset 0 0 14px rgba(255, 255, 255, .35);
    cursor: pointer;
    font-weight: 700;
    transition: box-shadow .25s ease, transform .15s ease;
  }
  .login-btn:hover { box-shadow: 0 0 34px rgba(66, 232, 255, .6); }
  .login-btn:active { transform: scale(.97); }
  .login-btn:disabled { opacity: .55; pointer-events: none; }

  .login-error {
    min-height: 16px;
    margin-top: 12px;
    text-align: center;
    font-size: 10px;
    letter-spacing: .18em;
    text-indent: .18em;
    color: var(--err);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .login-error.show { opacity: 1; }

  .login-foot {
    margin-top: 18px;
    text-align: center;
    font-size: 8px;
    letter-spacing: .3em;
    text-indent: .3em;
    text-transform: uppercase;
    color: rgba(66, 232, 255, .35);
  }

  /* ---------- shell ---------- */
  #shell {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding:
      calc(env(safe-area-inset-top, 0px) + 12px)
      calc(env(safe-area-inset-right, 0px) + 12px)
      calc(env(safe-area-inset-bottom, 0px) + 12px)
      calc(env(safe-area-inset-left, 0px) + 12px);
    transition: opacity .5s ease;
  }
  #shell.hidden { opacity: 0; pointer-events: none; }

  .corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border: 1px solid rgba(66, 232, 255, .35);
    pointer-events: none;
    z-index: 8;
  }
  .corner.tl { top: calc(env(safe-area-inset-top, 0px) + 5px); left: calc(env(safe-area-inset-left, 0px) + 5px); border-right: 0; border-bottom: 0; }
  .corner.tr { top: calc(env(safe-area-inset-top, 0px) + 5px); right: calc(env(safe-area-inset-right, 0px) + 5px); border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: calc(env(safe-area-inset-bottom, 0px) + 5px); left: calc(env(safe-area-inset-left, 0px) + 5px); border-right: 0; border-top: 0; }
  .corner.br { bottom: calc(env(safe-area-inset-bottom, 0px) + 5px); right: calc(env(safe-area-inset-right, 0px) + 5px); border-left: 0; border-top: 0; }

  /* ---------- header ---------- */
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 12px 0;
    border-bottom: 1px solid rgba(66, 232, 255, .18);
    min-width: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
    min-width: 0;
  }
  .brand-logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow:
      0 0 0 2px rgba(66,232,255,.55),
      0 0 14px rgba(66,232,255,.5),
      0 0 30px rgba(66,232,255,.2);
    animation: breathe 3.6s ease-in-out infinite;
    pointer-events: none;
    flex: 0 0 auto;
  }

  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-kicker {
    font-size: 8px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: rgba(66, 232, 255, .55);
    text-indent: .32em;
    margin-bottom: 2px;
  }
  .brand h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 400;
    letter-spacing: .16em;
    color: #dff9ff;
    text-shadow: 0 0 14px rgba(66, 232, 255, .55);
    text-indent: .16em;
    white-space: nowrap;
  }

  .root-path {
    flex: 1 1 0;
    min-width: 0;
    color: rgba(66, 232, 255, .5);
    font-size: 10px;
    letter-spacing: .12em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-left: 6px;
    border-left: 1px solid rgba(66, 232, 255, .2);
  }

  .toolbar {
    flex: 0 0 auto;
    display: flex;
    gap: 6px;
    align-items: center;
    margin-left: auto;
  }

  /* ---------- buttons ---------- */
  button {
    font-family: var(--font-serif);
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    text-indent: .2em;
    color: #cdf6ff;
    background: linear-gradient(145deg, #1b3858, #0b1728);
    border: 1px solid #548fc477;
    padding: 8px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    box-shadow: 0 4px 14px #0006, inset 0 0 10px #5caeff12;
    transition: box-shadow .25s ease, border-color .25s ease, transform .15s ease, background .25s ease;
  }
  button svg { width: 13px; height: 13px; flex: none; }
  button:hover {
    border-color: rgba(128, 201, 255, .95);
    box-shadow: 0 0 18px rgba(57, 158, 255, .4), inset 0 0 12px #5caeff20;
  }
  button:active { transform: scale(.94); }
  button:focus-visible,
  .tree-row:focus-visible {
    outline: 2px solid rgba(66, 232, 255, .85);
    outline-offset: 2px;
  }
  button:disabled { opacity: .4; pointer-events: none; }

  .btn-danger:hover {
    border-color: rgba(255, 122, 107, .95);
    box-shadow: 0 0 18px rgba(255, 122, 107, .4);
    color: #ffd8d3;
  }

  /* upload progress strip */
  #progress {
    display: none;
    flex: 0 0 auto;
    align-items: center;
    gap: 10px;
    padding: 6px 2px 0;
    font-size: 9px;
    letter-spacing: .2em;
    color: rgba(66, 232, 255, .75);
  }
  #progress.show { display: flex; }
  #progress .bar {
    flex: 1;
    height: 3px;
    background: rgba(66, 232, 255, .12);
    border-radius: 99px;
    overflow: hidden;
  }
  #progress .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #2ec7e6, #6ff0ff);
    box-shadow: 0 0 10px rgba(66, 232, 255, .6);
    transition: width .15s ease;
  }

  /* ---------- main split ---------- */
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 10px;
    padding-top: 10px;
  }

  /* ---------- tree ---------- */
  aside {
    width: clamp(200px, 32vw, 300px);
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid rgba(66, 232, 255, .2);
    box-shadow: 0 0 24px rgba(66, 232, 255, .05), inset 0 0 18px rgba(66, 232, 255, .03);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    overflow-y: auto;
    padding: 8px 0;
    overscroll-behavior: contain;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-track { background: transparent; }
  aside::-webkit-scrollbar-thumb { background: rgba(66, 232, 255, .25); border-radius: 99px; }

  .tree-node { user-select: none; }

  .tree-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: .04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-left: 2px solid transparent;
    color: #c8e9f5;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .tree-row:hover { background: rgba(66, 232, 255, .06); color: #e6faff; }
  .tree-row.active {
    background: rgba(66, 232, 255, .1);
    border-left-color: var(--cy);
    color: #e9fdff;
    box-shadow: inset 0 0 18px rgba(66, 232, 255, .08);
  }
  .tree-row .chevron {
    width: 12px; height: 12px;
    flex: none;
    color: rgba(66, 232, 255, .5);
    display: inline-flex;
    transition: transform .15s ease;
  }
  .tree-row .chevron.open { transform: rotate(90deg); }
  .tree-row .icon { width: 14px; height: 14px; flex: none; display: inline-flex; }

  .icon-dir   { color: rgba(66, 232, 255, .9); }
  .icon-code  { color: #6ff0b6; }
  .icon-media { color: #c8a8ff; }
  .icon-archive { color: var(--amber); }
  .icon-doc   { color: rgba(149, 213, 232, .6); }

  .tree-row .name { overflow: hidden; text-overflow: ellipsis; }
  .tree-row .size {
    margin-left: auto;
    color: rgba(66, 232, 255, .38);
    font-size: 10px;
    letter-spacing: .1em;
    padding-left: 10px;
    flex: none;
  }
  .tree-row.active .size { color: rgba(66, 232, 255, .7); }

  .tree-children { padding-left: 14px; display: none; }
  .tree-children.open { display: block; }
  .tree-empty {
    color: rgba(149, 213, 232, .4);
    padding: 5px 10px 5px 24px;
    font-size: 11px;
    font-style: italic;
    letter-spacing: .1em;
  }

  /* ---------- preview ---------- */
  section.preview {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border: 1px solid rgba(66, 232, 255, .2);
    box-shadow: 0 0 24px rgba(66, 232, 255, .05), inset 0 0 18px rgba(66, 232, 255, .03);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    overflow: hidden;
  }

  .preview-header {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(66, 232, 255, .15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: rgba(66, 232, 255, .03);
    flex: none;
    min-width: 0;
  }
  .preview-header .path {
    font-family: var(--font-serif);
    font-size: 11.5px;
    letter-spacing: .12em;
    color: rgba(205, 246, 255, .85);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 0;
  }
  .preview-header .path::before {
    content: "▸ ";
    color: var(--cy);
    opacity: .7;
  }

  .preview-body {
    flex: 1;
    overflow: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .preview-body::-webkit-scrollbar { width: 5px; height: 5px; }
  .preview-body::-webkit-scrollbar-thumb { background: rgba(66, 232, 255, .25); border-radius: 99px; }

  pre {
    background: rgba(1, 12, 22, .9);
    padding: 14px 16px;
    border-radius: 4px;
    border: 1px solid rgba(66, 232, 255, .18);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
    color: #d8f6ff;
    letter-spacing: 0;
  }

  img.preview-img {
    max-width: 100%;
    border-radius: 6px;
    border: 1px solid rgba(66, 232, 255, .28);
    box-shadow: 0 0 24px rgba(66, 232, 255, .15);
    display: block;
  }

  .empty {
    color: rgba(149, 213, 232, .55);
    padding: 4px 2px;
    font-size: 12px;
    letter-spacing: .1em;
  }
  .empty.error { color: var(--err); text-shadow: 0 0 10px rgba(255, 122, 107, .3); }

  .spinner {
    color: rgba(66, 232, 255, .55);
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    padding: 16px;
    text-indent: .3em;
    animation: pulseTxt 1.4s ease-in-out infinite;
  }
  @keyframes pulseTxt { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

  /* ---------- responsive ---------- */
  @media (max-width: 620px) {
    main { flex-direction: column; }
    aside { width: 100%; max-height: 34vh; flex: 0 0 auto; }
    section.preview { flex: 1 1 auto; min-height: 0; }
  }

  @media (max-width: 560px) {
    header {
      flex-wrap: wrap;
      gap: 8px;
    }
    .root-path {
      order: 3;
      flex: 1 1 100%;
      border-left: 0;
      padding-left: 0;
      margin-top: 2px;
      font-size: 9px;
    }
    .toolbar { margin-left: auto; }
    header .toolbar button {
      padding: 7px 9px;
      font-size: 8px;
      letter-spacing: .16em;
      text-indent: .16em;
    }
  }

  @media (max-width: 380px) {
    .brand h1 { font-size: 13px; letter-spacing: .12em; }
    .brand-kicker { font-size: 7px; letter-spacing: .24em; }
    .brand-logo { width: 28px; height: 28px; }
    header .toolbar button {
      padding: 6px 8px;
      font-size: 7.5px;
    }
    header .toolbar button svg { width: 11px; height: 11px; }
  }

  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 6px 0 8px 0; }
    .brand h1 { font-size: 13px; }
    .brand-logo { width: 26px; height: 26px; }
    .brand-kicker { font-size: 7px; }
    main { padding-top: 6px; gap: 8px; }
    aside { width: clamp(160px, 24vw, 220px); }
    .preview-body { padding: 10px; }
    .login-card { padding: 22px 18px 18px; }
    .login-logo { width: 60px; height: 60px; margin-bottom: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  }
</style>
</head>
<body>
  <!-- background -->
  <div id="bg-fallback"></div>
  <div id="grid"></div>
  <div id="vignette"></div>
  <div id="flicker"></div>
  <div id="scanlines"></div>

  <!-- ============================================================
       LOGIN
       ============================================================ -->
  <div id="login">
    <div class="login-card">
      <img class="login-logo" src="https://i.ibb.co.com/jkznH759/81b81b38c72e148ce4ddfcae172733f0.jpg" alt="">
      <div class="login-kicker">J.A.R.V.I.S. · secure access</div>
      <div class="login-title">AUTHENTICATE</div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginUser">Operator ID</label>
          <input id="loginUser" type="text" placeholder="Enter your ID" autocomplete="username" spellcheck="false" required />
        </div>
        <div class="field">
          <label for="loginPass">Passphrase</label>
          <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">AUTHORIZE</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-foot">Secure channel · v2.1</div>
    </div>
  </div>

  <!-- ============================================================
       MAIN SHELL
       ============================================================ -->
  <div id="shell" class="hidden">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <header>
      <div class="brand">
        <img class="brand-logo" src="https://i.ibb.co.com/jkznH759/81b81b38c72e148ce4ddfcae172733f0.jpg" alt="">
        <div class="brand-text">
          <div class="brand-kicker">J.A.R.V.I.S. · archive</div>
          <h1>STORAGE</h1>
        </div>
      </div>
      <span class="root-path" id="rootPath"></span>
      <div class="toolbar">
        <input type="file" id="uploadInput" hidden multiple />
        <button id="uploadBtn" type="button"></button>
        <button id="refreshBtn" type="button"></button>
        <button id="logoutBtn" type="button" class="btn-danger"></button>
      </div>
    </header>

    <div id="progress">
      <span id="progressLabel">UPLOADING…</span>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <span id="progressPct">0%</span>
    </div>

    <main>
      <aside><div id="tree"><div class="spinner">Loading…</div></div></aside>
      <section class="preview">
        <div class="preview-header">
          <div class="path" id="currentPath">No file selected</div>
          <div class="toolbar">
            <button id="downloadBtn" type="button" style="display:none"></button>
            <button id="deleteBtn" type="button" class="btn-danger" style="display:none"></button>
          </div>
        </div>
        <div class="preview-body" id="previewBody">
          <div class="empty">Select a file from the tree to preview it.</div>
        </div>
      </section>
    </main>
  </div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const ICONS = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
};

/* ============================================================
   DOM
   ============================================================ */
const loginEl     = document.getElementById('login');
const loginForm   = document.getElementById('loginForm');
const loginUser   = document.getElementById('loginUser');
const loginPass   = document.getElementById('loginPass');
const loginBtn    = document.getElementById('loginBtn');
const loginError  = document.getElementById('loginError');
const shellEl     = document.getElementById('shell');

const uploadBtn   = document.getElementById('uploadBtn');
const refreshBtn  = document.getElementById('refreshBtn');
const dlBtn       = document.getElementById('downloadBtn');
const delBtn      = document.getElementById('deleteBtn');
const logoutBtn   = document.getElementById('logoutBtn');

uploadBtn.innerHTML   = ICONS.upload   + 'Upload';
refreshBtn.innerHTML  = ICONS.refresh  + 'Refresh';
dlBtn.innerHTML       = ICONS.download + 'Download';
delBtn.innerHTML      = ICONS.trash    + 'Delete';
logoutBtn.innerHTML   = ICONS.logout   + 'Logout';

const treeEl     = document.getElementById('tree');
const bodyEl     = document.getElementById('previewBody');
const curPathEl  = document.getElementById('currentPath');
const uploadInput= document.getElementById('uploadInput');

const progressEl = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const progressPct = document.getElementById('progressPct');

/* ============================================================
   AUTH
   ============================================================ */
function showError(msg) {
  loginError.textContent = msg;
  loginError.classList.add('show');
}
function clearError() {
  loginError.textContent = '';
  loginError.classList.remove('show');
}

function enterApp() {
  loginEl.classList.add('hidden');
  shellEl.classList.remove('hidden');
  loadTree();
}

async function logout() {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}

  treeEl.innerHTML = '<div class="spinner">Loading…</div>';
  bodyEl.innerHTML = '<div class="empty">Select a file from the tree to preview it.</div>';
  curPathEl.textContent = 'No file selected';
  document.getElementById('rootPath').textContent = '';
  dlBtn.style.display = 'none';
  delBtn.style.display = 'none';
  currentFile = null;

  shellEl.classList.add('hidden');
  loginEl.classList.remove('hidden');
  loginUser.value = '';
  loginPass.value = '';
  clearError();
  setTimeout(() => loginUser.focus(), 400);
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearError();

  const u = loginUser.value.trim();
  const p = loginPass.value;
  if (!u || !p) { showError('Credentials required.'); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = 'VERIFYING…';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: u, pass_: p }),
      credentials: 'same-origin',
    });
    if (!res.ok) throw new Error('auth');
    loginBtn.textContent = 'ACCESS GRANTED';
    setTimeout(enterApp, 350);
  } catch {
    showError('Access denied. Invalid credentials.');
    loginBtn.disabled = false;
    loginBtn.textContent = 'AUTHORIZE';
    loginPass.value = '';
    loginPass.focus();
  }
});

logoutBtn.onclick = logout;

/* ============================================================
   STORAGE APP
   ============================================================ */
let currentFile = null;

function fmtSize(bytes) {
  if (bytes == null) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, n = bytes;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 ? 1 : 0)} ${u[i]}`;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fileGroup(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['py', 'js', 'ts', 'jsx', 'tsx', 'json', 'sh', 'rb', 'go', 'rs', 'java', 'c', 'cpp', 'html', 'css'].includes(ext)) return 'code';
  if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp', 'mp4', 'webm', 'mov', 'mp3', 'wav', 'ogg'].includes(ext)) return 'media';
  if (['zip', 'tar', 'gz', 'rar', '7z'].includes(ext)) return 'archive';
  return 'doc';
}

function buildTree(nodes, parentEl) {
  for (const node of nodes) {
    const wrap = el('div', 'tree-node');
    const row = el('div', 'tree-row');
    row.tabIndex = 0;

    const arrow = el('span', 'chevron');
    const icon = el('span', 'icon ' + (node.is_dir ? 'icon-dir' : 'icon-' + fileGroup(node.name)));
    icon.innerHTML = node.is_dir ? ICONS.folder : ICONS.file;
    if (node.is_dir) arrow.innerHTML = ICONS.chevron;

    const name = el('span', 'name', node.name);
    const size = el('span', 'size', node.is_dir ? '' : fmtSize(node.size));
    row.append(arrow, icon, name, size);
    wrap.appendChild(row);

    let childrenEl = null;
    if (node.is_dir) {
      childrenEl = el('div', 'tree-children');
      if (node.children && node.children.length) {
        buildTree(node.children, childrenEl);
      } else {
        childrenEl.appendChild(el('div', 'tree-empty', 'Empty folder'));
      }
      wrap.appendChild(childrenEl);

      const toggle = () => {
        const open = childrenEl.classList.toggle('open');
        arrow.classList.toggle('open', open);
        markActive(row);
      };
      row.onclick = toggle;
      row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    } else {
      const toggle = () => { markActive(row); openFile(node.path); };
      row.onclick = toggle;
      row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
    }

    parentEl.appendChild(wrap);
  }
}

let activeRow = null;
function markActive(row) {
  if (activeRow) activeRow.classList.remove('active');
  row.classList.add('active');
  activeRow = row;
}

async function loadTree() {
  treeEl.innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const res = await fetch('/api/tree', { credentials: 'same-origin' });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    document.getElementById('rootPath').textContent = data.root;
    treeEl.innerHTML = '';
    if (!data.children.length) {
      treeEl.innerHTML = '<div class="empty" style="padding:16px">This folder is empty.</div>';
      return;
    }
    buildTree(data.children, treeEl);
  } catch (e) {
    treeEl.innerHTML = `<div class="empty error" style="padding:16px">Couldn't load the file list: ${e.message}</div>`;
  }
}

async function openFile(path) {
  currentFile = path;
  curPathEl.textContent = path;
  bodyEl.innerHTML = '<div class="spinner">Loading…</div>';
  dlBtn.style.display = 'inline-flex';
  delBtn.style.display = 'inline-flex';
  dlBtn.onclick = () => {
    window.location.href = `/api/download?path=${encodeURIComponent(path)}`;
  };
  delBtn.onclick = () => deleteFile(path);

  try {
    const res = await fetch(`/api/preview?path=${encodeURIComponent(path)}`, { credentials: 'same-origin' });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    bodyEl.innerHTML = '';

    if (data.type === 'text') {
      bodyEl.appendChild(el('pre', null, data.content));
    } else if (data.type === 'image') {
      const img = el('img', 'preview-img');
      img.src = data.url;
      bodyEl.appendChild(img);
    } else if (data.type === 'large') {
      bodyEl.appendChild(el('div', 'empty', `File too large to preview (${fmtSize(data.size)}). Use Download.`));
    } else if (data.type === 'binary') {
      bodyEl.appendChild(el('div', 'empty', `Binary file (${data.mime}, ${fmtSize(data.size)}). Use Download.`));
    } else if (data.type === 'error') {
      bodyEl.appendChild(el('div', 'empty error', data.message || 'Preview error.'));
    } else {
      bodyEl.appendChild(el('div', 'empty', data.message || 'Preview not available.'));
    }
  } catch (e) {
    bodyEl.innerHTML = `<div class="empty error">Couldn't load this file: ${e.message}</div>`;
  }
}

async function deleteFile(path) {
  if (!confirm(`Delete "${path}"?`)) return;
  try {
    const res = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
      credentials: 'same-origin',
    });
    if (res.status === 401) { logout(); return; }
    if (res.ok) {
      currentFile = null;
      curPathEl.textContent = 'No file selected';
      bodyEl.innerHTML = '<div class="empty">File deleted.</div>';
      dlBtn.style.display = 'none';
      delBtn.style.display = 'none';
      loadTree();
    } else {
      alert('Delete failed.');
    }
  } catch (e) {
    alert('Delete failed: ' + e.message);
  }
}

/* ============================================================
   UPLOAD — streaming via XHR for progress; any file size
   ============================================================ */
function uploadOne(file, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?path=', true);
    xhr.withCredentials = true;

    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable && onProgress) {
        onProgress(ev.loaded / ev.total);
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
      else if (xhr.status === 401) { logout(); reject(new Error('auth')); }
      else reject(new Error(`Upload failed (${xhr.status})`));
    };
    xhr.onerror = () => reject(new Error('Network error during upload'));
    xhr.onabort = () => reject(new Error('Upload aborted'));

    xhr.send(fd);
  });
}

uploadInput.onchange = async () => {
  const files = [...uploadInput.files];
  if (!files.length) return;
  uploadInput.value = '';

  uploadBtn.disabled = true;
  refreshBtn.disabled = true;
  progressEl.classList.add('show');

  let okCount = 0;
  let failCount = 0;

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    progressLabel.textContent = `UPLOADING ${i + 1}/${files.length} · ${f.name}`;
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';

    try {
      await uploadOne(f, (ratio) => {
        progressFill.style.width = (ratio * 100) + '%';
        progressPct.textContent = Math.round(ratio * 100) + '%';
      });
      okCount++;
    } catch (err) {
      console.error('Upload failed:', f.name, err);
      failCount++;
    }
  }

  progressLabel.textContent = failCount
    ? `DONE · ${okCount} OK · ${failCount} FAILED`
    : `DONE · ${okCount} FILE${okCount === 1 ? '' : 'S'} UPLOADED`;
  progressFill.style.width = '100%';
  progressPct.textContent = '100%';

  setTimeout(() => {
    progressEl.classList.remove('show');
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
  }, 1600);

  uploadBtn.disabled = false;
  refreshBtn.disabled = false;

  loadTree();
};

uploadBtn.onclick = () => uploadInput.click();
refreshBtn.onclick = () => loadTree();

/* ============================================================
   BOOT — check session
   ============================================================ */
(async () => {
  try {
    const r = await fetch('/api/tree', { credentials: 'same-origin' });
    if (r.ok) { enterApp(); return; }
  } catch {}
  setTimeout(() => loginUser.focus(), 400);
})();
</script>
</body>
</html>
